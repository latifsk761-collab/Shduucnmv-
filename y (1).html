<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Neon Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        neonRed: '#ff2a5f',
                        neonCrimson: '#ff003c',
                        darkBg: '#09090b',
                        cardBg: '#121216',
                        btnBg: '#1a1a22',
                        btnHover: '#242430',
                    },
                    boxShadow: {
                        'neon': '0 0 18px rgba(255, 42, 95, 0.45)',
                        'neon-strong': '0 0 25px rgba(255, 0, 60, 0.7)',
                        'card': '0 25px 50px -12px rgba(0, 0, 0, 0.85)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom subtle scrollbar for long expressions */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Tactile button press animation */
        .calc-btn {
            transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body class="bg-darkBg text-white min-h-screen flex items-center justify-center p-4 selection:bg-neonRed selection:text-white">

    <!-- Ambient Background Glow -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-72 h-72 bg-neonCrimson/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-neonRed/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Calculator Container -->
    <main class="relative w-full max-w-sm bg-cardBg border border-zinc-800/80 rounded-3xl p-5 sm:p-6 shadow-card backdrop-blur-xl">
        
        <!-- Top Header Bar -->
        <header class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-neonRed shadow-neon animate-pulse"></span>
                <span class="text-xs font-semibold tracking-widest uppercase text-zinc-400">APEX CALC</span>
            </div>
            <button id="copyBtn" title="Copy Result" class="text-xs text-zinc-400 hover:text-neonRed transition-colors px-2.5 py-1 rounded-lg bg-zinc-900/90 border border-zinc-800 flex items-center gap-1.5">
                <span id="copyText">Copy</span>
            </button>
        </header>

        <!-- Display Screen -->
        <section class="bg-zinc-950/90 border border-zinc-800/90 rounded-2xl p-4 sm:p-5 mb-5 flex flex-col justify-end min-h-[124px] shadow-inner">
            <!-- Previous / Current Expression -->
            <div id="expressionDisplay" class="font-mono text-sm sm:text-base text-zinc-400 text-right overflow-x-auto no-scrollbar whitespace-nowrap min-h-[24px] mb-1">
                0
            </div>
            <!-- Main Result -->
            <div id="resultDisplay" class="font-mono text-3xl sm:text-4xl font-bold text-white text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight">
                0
            </div>
        </section>

        <!-- Keypad Grid -->
        <section class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button type="button" data-action="clear" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-semibold text-lg border border-neonRed/25">
                AC
            </button>
            <button type="button" data-action="backspace" aria-label="Backspace" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-zinc-200 font-semibold text-lg border border-zinc-800/80 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-neonRed" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                </svg>
            </button>
            <button type="button" data-value="%" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-semibold text-lg border border-zinc-800/80">
                %
            </button>
            <button type="button" data-value="/" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-bold text-xl border border-zinc-800/80">
                ÷
            </button>

            <!-- Row 2 -->
            <button type="button" data-value="7" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                7
            </button>
            <button type="button" data-value="8" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                8
            </button>
            <button type="button" data-value="9" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                9
            </button>
            <button type="button" data-value="*" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-bold text-xl border border-zinc-800/80">
                ×
            </button>

            <!-- Row 3 -->
            <button type="button" data-value="4" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                4
            </button>
            <button type="button" data-value="5" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                5
            </button>
            <button type="button" data-value="6" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                6
            </button>
            <button type="button" data-value="-" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-bold text-xl border border-zinc-800/80">
                −
            </button>

            <!-- Row 4 -->
            <button type="button" data-value="1" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                1
            </button>
            <button type="button" data-value="2" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                2
            </button>
            <button type="button" data-value="3" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                3
            </button>
            <button type="button" data-value="+" class="calc-btn p-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-neonRed font-bold text-xl border border-zinc-800/80">
                +
            </button>

            <!-- Row 5 -->
            <button type="button" data-value="00" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-zinc-300 font-semibold text-lg border border-zinc-800/60">
                00
            </button>
            <button type="button" data-value="0" class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-semibold text-xl border border-zinc-800/60">
                0
            </button>
            <button type="button" data-value="." class="calc-btn p-4 rounded-2xl bg-btnBg hover:bg-btnHover text-white font-bold text-xl border border-zinc-800/60">
                .
            </button>
            <button type="button" data-action="equals" class="calc-btn p-4 rounded-2xl bg-gradient-to-br from-neonRed to-neonCrimson hover:brightness-110 text-white font-bold text-2xl shadow-neon hover:shadow-neon-strong">
                =
            </button>
        </section>

        <!-- Subtle Footer Hint -->
        <footer class="mt-4 text-center">
            <p class="text-[11px] text-zinc-500">Supports touch &amp; physical keyboard</p>
        </footer>
    </main>

    <!-- Calculator Logic -->
    <script>
        (function () {
            const expressionDisplay = document.getElementById('expressionDisplay');
            const resultDisplay = document.getElementById('resultDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const copyText = document.getElementById('copyText');

            let currentExpression = '';
            let lastResult = '0';
            let isResultEvaluated = false;

            const operators = ['+', '-', '*', '/', '%'];

            // Format expression visually for display (replacing * and / with × and ÷)
            function formatForDisplay(expr) {
                if (!expr) return '0';
                return expr
                    .replace(/\*/g, '×')
                    .replace(/\//g, '÷')
                    .replace(/-/g, '−');
            }

            // Safe arithmetic evaluator without raw eval()
            function calculateExpression(expr) {
                try {
                    // Remove trailing operators before evaluating
                    let sanitized = expr.replace(/[+\-*/%.]+$/, '');
                    if (!sanitized) return '0';

                    // Convert percentage instances like "50%" -> "(50/100)"
                    sanitized = sanitized.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

                    // Validate allowed characters strictly
                    if (!/^[0-9+\-*/().\s]+$/.test(sanitized)) {
                        return 'Error';
                    }

                    // Compute using Function constructor after strict regex validation
                    const rawResult = new Function('return ' + sanitized)();

                    if (!isFinite(rawResult) || isNaN(rawResult)) {
                        return 'Cannot divide by 0';
                    }

                    // Fix floating-point precision artifacts (e.g., 0.1 + 0.2)
                    const rounded = Math.round((rawResult + Number.EPSILON) * 1e10) / 1e10;
                    return String(rounded);
                } catch (e) {
                    return 'Error';
                }
            }

            // Update UI displays and auto-scroll to latest digit
            function updateScreen(livePreview = true) {
                expressionDisplay.textContent = formatForDisplay(currentExpression);
                expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;

                if (livePreview && currentExpression) {
                    const preview = calculateExpression(currentExpression);
                    if (preview !== 'Error' && preview !== 'Cannot divide by 0') {
                        resultDisplay.textContent = preview;
                    }
                } else if (!currentExpression) {
                    resultDisplay.textContent = '0';
                }
                resultDisplay.scrollLeft = resultDisplay.scrollWidth;
            }

            // Handle number, decimal, or operator input
            function appendInput(val) {
                const lastChar = currentExpression.slice(-1);

                // If user just pressed '=' and types a number, start fresh
                if (isResultEvaluated) {
                    if (operators.includes(val)) {
                        currentExpression = lastResult !== 'Error' && lastResult !== 'Cannot divide by 0' ? lastResult : '0';
                    } else {
                        currentExpression = '';
                    }
                    isResultEvaluated = false;
                }

                // Prevent multiple leading zeros
                if ((val === '0' || val === '00') && currentExpression === '0') {
                    return;
                }
                if (val === '00' && currentExpression === '') {
                    currentExpression = '0';
                    updateScreen();
                    return;
                }

                // Prevent duplicate operators
                if (operators.includes(val)) {
                    if (currentExpression === '' && val !== '-') return;
                    if (operators.includes(lastChar)) {
                        currentExpression = currentExpression.slice(0, -1) + val;
                        updateScreen();
                        return;
                    }
                }

                // Prevent multiple decimals in the same number segment
                if (val === '.') {
                    const segments = currentExpression.split(/[+\-*/%]/);
                    const currentSegment = segments[segments.length - 1];
                    if (currentSegment.includes('.')) return;
                    if (currentSegment === '') {
                        currentExpression += '0.';
                        updateScreen();
                        return;
                    }
                }

                // Replace initial '0' if a non-zero digit is pressed
                if (currentExpression === '0' && !operators.includes(val) && val !== '.') {
                    currentExpression = val;
                } else {
                    currentExpression += val;
                }

                updateScreen(true);
            }

            // Clear all state
            function clearAll() {
                currentExpression = '';
                lastResult = '0';
                isResultEvaluated = false;
                expressionDisplay.textContent = '0';
                resultDisplay.textContent = '0';
            }

            // Delete last character
            function deleteLast() {
                if (isResultEvaluated) {
                    isResultEvaluated = false;
                }
                currentExpression = currentExpression.slice(0, -1);
                updateScreen(true);
            }

            // Finalize calculation on '='
            function evaluateFinal() {
                if (!currentExpression) return;
                const finalRes = calculateExpression(currentExpression);
                resultDisplay.textContent = finalRes;
                lastResult = finalRes;
                isResultEvaluated = true;
                resultDisplay.scrollLeft = resultDisplay.scrollWidth;
            }

            // Button click listeners
            document.querySelectorAll('.calc-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.getAttribute('data-action');
                    const value = btn.getAttribute('data-value');

                    if (action === 'clear') {
                        clearAll();
                    } else if (action === 'backspace') {
                        deleteLast();
                    } else if (action === 'equals') {
                        evaluateFinal();
                    } else if (value) {
                        appendInput(value);
                    }
                });
            });

            // Physical keyboard support
            document.addEventListener('keydown', (e) => {
                const key = e.key;

                if (/^[0-9]$/.test(key) || ['+', '-', '*', '/', '%', '.'].includes(key)) {
                    e.preventDefault();
                    appendInput(key);
                } else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    evaluateFinal();
                } else if (key === 'Backspace') {
                    e.preventDefault();
                    deleteLast();
                } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                    e.preventDefault();
                    clearAll();
                }
            });

            // Copy result to clipboard using execCommand fallback
            copyBtn.addEventListener('click', () => {
                const textToCopy = resultDisplay.textContent;
                const tempInput = document.createElement('textarea');
                tempInput.value = textToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    copyText.textContent = 'Copied!';
                    copyBtn.classList.add('text-neonRed', 'border-neonRed/50');
                    setTimeout(() => {
                        copyText.textContent = 'Copy';
                        copyBtn.classList.remove('text-neonRed', 'border-neonRed/50');
                    }, 1400);
                } catch (err) {
                    copyText.textContent = 'Failed';
                }
                document.body.removeChild(tempInput);
            });
        })();
    </script>
</body>
</html>
